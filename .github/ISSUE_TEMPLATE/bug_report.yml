name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: PHP 8.3, MySQL 8, Docker / shared hosting, browser
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From storage/logs/laravel.log (remove any secrets).
      render: shell
