# Quick start:  cp .env.example .env  (set APP_KEY, APP_URL, mail and R2 values)
#               docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-task_tracker}
      DB_USERNAME: ${DB_USERNAME:-task_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  # Sends reminder emails and creates recurring tasks.
  scheduler:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-task_tracker}
      DB_USERNAME: ${DB_USERNAME:-task_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - storage:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-task_tracker}
      MYSQL_USER: ${DB_USERNAME:-task_tracker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

volumes:
  storage:
  mysql:
